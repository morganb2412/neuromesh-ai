[project]
name = "neuromesh-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "networkx>=3.3,<5"]
[project.optional-dependencies]
agents = ["google-adk>=1.0"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
